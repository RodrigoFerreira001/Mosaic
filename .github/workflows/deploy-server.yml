name: Deploy sample-server (Cloud Run + Firebase Hosting)

on:
  push:
    branches:
      - main
    paths:
      - 'sample-server/**'
      - 'sample-core/**'
      - 'mosaic-server/**'
      - 'mosaic-core/**'
      - 'gradle/libs.versions.toml'
      - 'firebase.json'
      - '.github/workflows/deploy-server.yml'

  workflow_dispatch:

env:
  GCP_PROJECT_ID: mosaicsampleserver
  CLOUD_RUN_SERVICE: mosaic-sample-server
  CLOUD_RUN_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires the GCP_SA_KEY secret: a service account JSON key with the Cloud Run Admin,
      # Cloud Build Editor, Artifact Registry Writer, Service Account User and Firebase Hosting
      # Admin roles on the mosaicsampleserver project. See README "Deploying the showroom" for the
      # one-time setup steps (enabling APIs, creating the service account, adding this secret).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          source: .
          # Build context is the repo root; sample-server depends on sibling Gradle modules.
          docker_file: sample-server/Dockerfile

      # google-github-actions/auth already exported GOOGLE_APPLICATION_CREDENTIALS above;
      # firebase-tools picks up Application Default Credentials from it automatically.
      - name: Deploy Firebase Hosting rewrite
        run: npx firebase-tools deploy --only hosting --project ${{ env.GCP_PROJECT_ID }} --non-interactive
