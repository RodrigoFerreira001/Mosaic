<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaic Sample</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script>
        // Registers coi-serviceworker.js and reloads once, so this page is cross-origin isolated
        // (SharedArrayBuffer/Atomics available) before the wasm app boots and touches OPFS SQLite.
        // Guarded by sessionStorage so a failed/unnecessary registration can't loop reloads.
        (function () {
            if (self.crossOriginIsolated) return;
            if (!window.isSecureContext || !navigator.serviceWorker) return;
            if (sessionStorage.getItem('coiReloadedOnce')) return;

            navigator.serviceWorker.register('coi-serviceworker.js').then(function () {
                // Waits until the worker is actually active and has claimed this page
                // (self.clients.claim() in its activate handler) — reloading any earlier risks
                // the reloaded navigation itself not being intercepted yet.
                return navigator.serviceWorker.ready;
            }).then(function () {
                sessionStorage.setItem('coiReloadedOnce', '1');
                window.location.reload();
            }).catch(function (error) {
                console.error('Failed to register coi-serviceworker.js', error);
            });
        })();
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
